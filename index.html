        // Lokale spraakfunctie via browser Web Speech API
        function speakChinese(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop eventueel lopende spraak
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN'; // Mandarijn Chinees
                utterance.rate = 0.85;   // Iets langzamer voor leerders

                // Zoek naar een heldere lokale Chinese stem indien beschikbaar
                const voices = window.speechSynthesis.getVoices();
                const cnVoice = voices.find(v => v.lang === 'zh-CN' || v.lang.includes('zh'));
                if (cnVoice) {
                    utterance.voice = cnVoice;
                }

                window.speechSynthesis.speak(utterance);
            } else {
                alert('Spraak synthesie wordt helaas niet ondersteund door deze browser.');
            }
        }

        // Zorg dat stemmen geladen zijn op mobile/desktop
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        function loadNewRandomSet() {
            let shuffled = [...fullDatabase].sort(() => 0.5 - Math.random());
            currentSet = shuffled.slice(0, 30);
            document.getElementById('search-input').value = ''; 
            document.getElementById('set-info').textContent = "Huidige set: willekeurige selectie van tekens.";
            renderApp();
        }

        function saveStatus() {
            localStorage.setItem('manhua_hanzi_500_status', JSON.stringify(userStatus));
            updateProgress();
        }

        function updateProgress() {
            const greenCount = Object.values(userStatus).filter(s => s === 'green').length;
            document.getElementById('progress-count').textContent = greenCount;
            document.getElementById('total-database-count').textContent = fullDatabase.length;
        }

        function getPinyinForChar(char) {
            let cleanChar = char.charAt(0);
            let foundInDb = fullDatabase.find(item => item.char.charAt(0) === cleanChar);
            if (foundInDb) return foundInDb.pinyin;
            return cleanChar; 
        }

        function openWriterModal(char) {
            const modal = document.getElementById('writer-modal');
            const title = document.getElementById('modal-char-title');
            const targetContainer = document.getElementById('character-target');
            
            title.textContent = `Karakter: ${char}`;
            targetContainer.innerHTML = '';
            
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);

            activeWriter = HanziWriter.create('character-target', char, {
                width: 170,
                height: 170,
                padding: 10,
                showOutline: true,
                strokeAnimationSpeed: 1,
                delayBetweenStrokes: 300,
                strokeColor: '#c2410c',
                radicalColor: '#047857'
            });

            activeWriter.animateCharacter();
        }

        function animateWriter() {
            if (activeWriter) activeWriter.animateCharacter();
        }

            const modal = document.getElementById('writer-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function renderCompoundCard(comp) {
            let charsHtml = '';
            comp.chars.forEach(c => {
                charsHtml += `<span class="compound-token relative cursor-pointer px-2.5 py-1 rounded-xl bg-amber-100/70 hover:bg-amber-200 text-amber-950 chinese-font transition" onclick="showCompoundCharPinyin(event, this, '${c}')" title="Klik voor pinyin">${c}</span>`;
            });

            return `
                <div class="col-span-full bg-amber-50/70 rounded-3xl border-2 border-amber-500/80 p-6 shadow-sm mb-4">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <span class="text-xs font-bold uppercase tracking-wider text-amber-700 bg-amber-100 px-2.5 py-1 rounded-full">Samengesteld woord</span>
                            <h2 class="text-2xl font-bold text-stone-900 mt-2">${comp.translation} <span class="text-sm font-normal text-stone-500">(${comp.pinyin} / ${comp.word})</span></h2>
                        </div>
                        <div class="flex items-center gap-2 text-3xl font-bold flex-wrap">
                            ${charsHtml}
                        </div>
                    </div>
                    <p class="text-xs text-stone-500 mt-3">💡 Klik hierboven op een afzonderlijk karakter om de pinyin te zien.</p>
                </div>
            `;
        }

        function showCompoundCharPinyin(event, element, char) {
            event.stopPropagation();
            const target = element;
            const existing = target.querySelector('.char-popup');
            if (existing) existing.remove();

            let pinyin = getPinyinForChar(char);
            const popup = document.createElement('span');
            popup.className = 'char-popup absolute -top-8 left-1/2 -translate-x-1/2 bg-amber-800 text-amber-50 text-[11px] px-2.5 py-1 rounded-lg shadow-xl z-20 whitespace-nowrap font-sans tracking-wide';
            popup.textContent = pinyin;
            target.style.position = 'relative';
            target.appendChild(popup);

            setTimeout(() => popup.remove(), 3000);
        }

        function renderInteractiveSentence(sentenceObj) {
            const chars = Array.from(sentenceObj.chinese);
            let html = `<div class="sentence-box relative cursor-pointer select-none p-2.5 rounded-xl hover:bg-stone-200/50 transition border border-transparent hover:border-stone-300/60 group">`;
            
            html += `<div class="flex justify-between items-center gap-2">`;
            html += `<div class="text-base font-medium text-stone-800 chinese-font flex flex-wrap gap-1 items-center">`;
            chars.forEach((c) => {
                if (c.trim() === '') {
                    html += `<span class="mx-0.5"></span>`;
                } else {
                    html += `<span class="word-token relative px-1 rounded hover:bg-amber-200/60 hover:text-amber-950 transition" data-char="${c}" onclick="showWordPinyin(event, this)" title="Klik voor pinyin">${c}</span>`;
                }
            });
            html += `</div>`;

            // Knoppen rechts: Spreken + Kopiëren
            html += `<div class="flex items-center gap-1.5 whitespace-nowrap">`;
            html += `<button onclick="event.stopPropagation(); speakChinese('${sentenceObj.chinese}')" title="Luister naar Chinese uitspraak" class="px-2.5 py-1 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-lg text-xs font-medium transition flex items-center gap-1 shadow-xs">🔊 <span>Hoor</span></button>`;
            html += `<button onclick="copyFullSentence(event, '${sentenceObj.chinese}', '${sentenceObj.pinyinFull}', '${sentenceObj.translation}')" title="Kopieer zin inclusief pinyin en vertaling" class="copy-btn px-2.5 py-1 bg-stone-200/80 hover:bg-amber-200 text-stone-700 rounded-lg text-xs font-medium transition flex items-center gap-1 shadow-xs">📋 <span>Kopieer</span></button>`;
            html += `</div>`;

            html += `</div>`;

            html += `<div class="full-pinyin text-xs text-manhua-primary font-semibold mt-1.5 hidden bg-amber-100/70 px-2 py-1 rounded-lg border border-amber-300/60">${sentenceObj.pinyinFull}</div>`;
            html += `<div class="text-xs text-stone-500 mt-1 font-normal">${sentenceObj.translation}</div>`;
            html += `</div>`;
            return html;
        }

        function copyFullSentence(event, chinese, pinyin, translation) {
            event.stopPropagation();
            const btn = event.currentTarget;
            const textToCopy = `${chinese}\n${pinyin}\n${translation}`;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalContent = btn.innerHTML;
                btn.innerHTML = "✅ <span>Gekopieerd!</span>";
                btn.classList.add('bg-emerald-200', 'text-emerald-950', 'border', 'border-emerald-400');
                btn.classList.remove('bg-stone-200/80', 'text-stone-700', 'hover:bg-amber-200');

                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.remove('bg-emerald-200', 'text-emerald-950', 'border', 'border-emerald-400');
                    btn.classList.add('bg-stone-200/80', 'text-stone-700', 'hover:bg-amber-200');
                }, 2000);
            }).catch(err => console.error('Kopiëren mislukt: ', err));
        }

        function showWordPinyin(event, element) {
            event.stopPropagation();
            const target = element;
            const char = target.getAttribute('data-char');
            const existing = target.querySelector('.pinyin-popup');
            if (existing) existing.remove();

            let pinyin = getPinyinForChar(char);
            const popup = document.createElement('span');
            popup.className = 'pinyin-popup absolute -top-8 left-1/2 -translate-x-1/2 bg-amber-700 text-amber-50 text-[11px] px-2.5 py-1 rounded-lg shadow-xl z-20 whitespace-nowrap font-sans tracking-wide';
            popup.textContent = pinyin;
            target.style.position = 'relative';
            target.appendChild(popup);

            setTimeout(() => popup.remove(), 3000);
        }

        function revealPinyin(event, id, pinyinText) {
            event.stopPropagation();
            const btn = event.currentTarget;
            const container = btn.parentElement.querySelector('.popup-display');
            container.textContent = pinyinText;
            container.classList.remove('hidden');
            setTimeout(() => container.classList.add('hidden'), 3000);
        }

        function revealMeaning(event, id, meaningText) {
            event.stopPropagation();
            const btn = event.currentTarget;
            const container = btn.parentElement.querySelector('.popup-display');
            container.textContent = meaningText;
            container.classList.remove('hidden');
            setTimeout(() => container.classList.add('hidden'), 3000);
        }

        function renderApp() {
            const grid = document.getElementById('hanzi-grid');
            const filter = document.getElementById('filter-status').value;
            const rawSearchQuery = document.getElementById('search-input').value.trim();
            const searchQuery = normalizePinyin(rawSearchQuery);
            const setInfo = document.getElementById('set-info');

            grid.innerHTML = '';

            let matchedCompound = null;
            let targetDataset = currentSet;

            if (searchQuery.length > 0) {
                matchedCompound = compoundWords.find(c => 
                    c.translation.toLowerCase().includes(searchQuery) || 
                    normalizePinyin(c.word).includes(searchQuery) || 
                    c.searchPinyin.includes(searchQuery)
                );

                let matchedChars = matchedCompound ? matchedCompound.chars : [];

                targetDataset = fullDatabase.filter(item => {
                    let cleanBaseChar = item.char.charAt(0);
                    const matchesStandard = cleanBaseChar.toLowerCase().includes(searchQuery) || 
                                            normalizePinyin(item.pinyin).includes(searchQuery) || 
                                            item.meaning.toLowerCase().includes(searchQuery);
                    
                    const matchesCompoundChar = matchedChars.includes(cleanBaseChar);

                    if (matchedCompound) {
                        return matchesCompoundChar;
                    }

                    const matchesSentence = item.sentences.some(s => 
                        s.chinese.toLowerCase().includes(searchQuery) || 
                        normalizePinyin(s.pinyinFull).includes(searchQuery) || 
                        s.translation.toLowerCase().includes(searchQuery)
                    );

                    return matchesStandard || matchesSentence;
                });

                setInfo.textContent = `Zoekresultaten voor: "${rawSearchQuery}" (${targetDataset.length} resultaten gevonden)`;
            } else {
                setInfo.textContent = `Huidige set: willekeurige selectie van tekens.`;
            }

            if (matchedCompound) {
                grid.insertAdjacentHTML('beforeend', renderCompoundCard(matchedCompound));
            }

            const filteredData = targetDataset.filter(item => {
                const status = userStatus[item.id] || 'none';
                if (filter !== 'all' && status !== filter) return false;
                return true;
            });

            if (filteredData.length === 0 && !matchedCompound) {
                grid.innerHTML = `
                    <div class="col-span-full bg-[#fdfbf7] rounded-3xl border border-stone-300/80 p-8 shadow-sm text-center">
                        <div class="w-12 h-12 mx-auto mb-3 rounded-2xl bg-amber-100 text-amber-800 flex items-center justify-center text-xl font-bold">🔍</div>
                        <h3 class="text-base font-bold text-stone-900 mb-1">Geen resultaat gevonden voor "${rawSearchQuery}"</h3>
                        <p class="text-xs text-stone-500 max-w-md mx-auto mb-4">Dit woord of pinyin-patroon staat momenteel niet in onze index.</p>
                    </div>
                `;
                return;
            }

            filteredData.forEach(item => {
                const status = userStatus[item.id] || 'none';
                
                let statusBorderColor = 'border-stone-300/80';
                let statusCardBg = 'bg-[#fdfbf7]';
                let statusBadge = '';

                if (status === 'green') {
                    statusBorderColor = 'border-emerald-500 shadow-emerald-500/10';
                    statusCardBg = 'bg-emerald-50/80';
                    statusBadge = '<span class="text-xs bg-emerald-500 text-white px-3 py-1 rounded-full font-bold shadow-xs">🟢 Groen</span>';
                } else if (status === 'orange') {
                    statusBorderColor = 'border-amber-500 shadow-amber-500/10';
                    statusCardBg = 'bg-amber-50/80';
                    statusBadge = '<span class="text-xs bg-amber-500 text-white px-3 py-1 rounded-full font-bold shadow-xs">🟠 Oranje</span>';
                } else if (status === 'red') {
                    statusBorderColor = 'border-rose-500 shadow-rose-500/10';
                    statusCardBg = 'bg-rose-50/80';
                    statusBadge = '<span class="text-xs bg-rose-500 text-white px-3 py-1 rounded-full font-bold shadow-xs">🔴 Rood</span>';
                }

                const card = document.createElement('div');
                card.className = `${statusCardBg} rounded-3xl border-2 ${statusBorderColor} p-6 shadow-sm flex flex-col justify-between transition-all duration-300 hover:shadow-md hover:-translate-y-0.5`;
                
                let displayChar = item.char.charAt(0);

                let sentencesHtml = '';
                item.sentences.forEach(s => {
                    sentencesHtml += renderInteractiveSentence(s);
                });

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-4">
                                <div onclick="openWriterModal('${displayChar}')" title="Klik om schrijfvolgorde te zien" class="w-16 h-16 rounded-2xl bg-stone-900 hover:bg-manhua-primary text-white flex items-center justify-center text-4xl chinese-font shadow-md cursor-pointer transition transform hover:scale-105" role="button" aria-label="Schrijfanimatie openen voor ${displayChar}">${displayChar}</div>
                                <div>
                                    ${statusBadge}
                                    <p class="text-[11px] text-stone-400 mt-1">Klik teken voor animatie</p>
                                </div>
                            </div>
                        </div>

                        <div class="relative bg-stone-100/70 border border-stone-200 p-2.5 rounded-2xl flex items-center justify-between gap-2 my-4">
                            <div class="popup-display hidden absolute inset-0 bg-amber-700 text-amber-50 text-sm font-bold rounded-2xl flex items-center justify-center px-3 tracking-wide z-10 text-center shadow-md"></div>
                            
                            <button onclick="revealPinyin(event, ${item.id}, '${item.pinyin}')" class="flex-1 py-1.5 px-3 bg-white hover:bg-stone-50 border border-stone-300/80 text-xs font-semibold text-stone-700 rounded-xl shadow-xs transition flex items-center justify-center gap-1.5">
                                <span>🔊 Pinyin</span>
                            </button>
                            <button onclick="revealMeaning(event, ${item.id}, '${item.meaning}')" class="flex-1 py-1.5 px-3 bg-white hover:bg-stone-50 border border-stone-300/80 text-xs font-semibold text-stone-700 rounded-xl shadow-xs transition flex items-center justify-center gap-1.5">
                                <span>💡 Betekenis</span>
                            </button>
                        </div>

                        <div class="space-y-2 mt-4 pt-4 border-t border-stone-200/80">
                            <p class="text-[11px] font-bold text-stone-400 uppercase tracking-wider">A2 Voorbeeldzinnen (Dubbelklik zin)</p>
                            ${sentencesHtml}
                        </div>
                    </div>

                    <div class="flex gap-2 mt-6 pt-4 border-t border-stone-200/80">
                        <button onclick="setStatus(${item.id}, 'green')" class="flex-1 py-2 text-xs font-bold rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white transition shadow-sm ${status === 'green' ? 'ring-2 ring-emerald-700 ring-offset-2' : ''}">Groen</button>
                        <button onclick="setStatus(${item.id}, 'orange')" class="flex-1 py-2 text-xs font-bold rounded-xl bg-amber-500 hover:bg-amber-600 text-white transition shadow-sm ${status === 'orange' ? 'ring-2 ring-amber-700 ring-offset-2' : ''}">Oranje</button>
                        <button onclick="setStatus(${item.id}, 'red')" class="flex-1 py-2 text-xs font-bold rounded-xl bg-rose-500 hover:bg-rose-600 text-white transition shadow-sm ${status === 'red' ? 'ring-2 ring-rose-700 ring-offset-2' : ''}">Rood</button>
                    </div>
                `;

                const sentenceBoxes = card.querySelectorAll('.sentence-box');
                sentenceBoxes.forEach((box) => {
                    box.addEventListener('dblclick', () => {
                        const fullPinyinEl = box.querySelector('.full-pinyin');
                        fullPinyinEl.classList.remove('hidden');
                        setTimeout(() => fullPinyinEl.classList.add('hidden'), 3000);
                    });
                });

                grid.appendChild(card);
            });
        }

        function setStatus(id, status) {
            if (userStatus[id] === status) {
                delete userStatus[id];
            } else {
                userStatus[id] = status;
            }
            saveStatus();
            renderApp();
        }

        document.getElementById('filter-status').addEventListener('change', renderApp);
        document.getElementById('search-input').addEventListener('input', renderApp);

        loadNewRandomSet();
        updateProgress();
    </script>
</body>
</html>
